<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <title>Баклажанос / Eggplanos — знак первого аддона</title>
  <!-- тело: узкие плечи, тяжёлый низ — силуэт баклажана, а не сливы -->
  <path d="M100 48c30 0 48 26 54 60 8 38 22 66 22 96 0 40-34 64-76 64s-76-24-76-64c0-30 14-58 22-96 6-34 24-60 54-60z"
        fill="#8A6FC0"/>
  <!-- блик -->
  <path d="M58 132c3-26 13-44 27-55 6-5 12 1 7 7-11 12-17 27-20 46-1 8-15 6-14 2z" fill="#A88FD6"/>

  <!-- чашелистики и хвостик -->
  <path d="M44 68c10-24 23-22 30-7 4-20 17-24 22-7 5-17 18-13 22 7 7-15 20-17 30 7-15 15-38 21-52 21s-37-6-52-21z"
        fill="#6FA65A"/>
  <path d="M94 14c8-4 16 2 14 10l-6 28-16-4 4-28c0-3 2-5 4-6z" fill="#4E7A40"/>

  <!-- брови: левая опущена, правая вздёрнута — наглость -->
  <path d="M54 140q16-8 32-3" stroke="#141018" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M112 128q16-11 32 2" stroke="#141018" stroke-width="9" stroke-linecap="round" fill="none"/>

  <!-- глаза: левый прищурен, правый круглый -->
  <path d="M58 158a11 11 0 0 0 22 0z" fill="#141018"/>
  <circle cx="129" cy="156" r="11.5" fill="#141018"/>
  <circle cx="133" cy="152" r="3.5" fill="#EDE6DA"/>

  <!-- ухмылка: правый угол заметно выше левого -->
  <path d="M54 200q46 12 92-20-4 66-52 66-34 0-40-46z" fill="#141018"/>
  <path d="M56 202q44 11 88-19v14q-44 26-86 17z" fill="#EDE6DA"/>
  <path d="M84 209v16M112 206v17" stroke="#141018" stroke-width="3" opacity=".4"/>
  <path d="M78 242q22-12 44 0-8 18-22 18t-22-18z" fill="#C24B33"/>

  <!-- блик на зубе -->
  <g transform="translate(139 187)">
    <path d="M0-19 4.5-4.5 19 0 4.5 4.5 0 19-4.5 4.5-19 0-4.5-4.5z"
          fill="#EDE6DA" stroke="#141018" stroke-width="3" stroke-linejoin="round"/>
    <path d="M0-9 2-2 9 0 2 2 0 9-2 2-9 0-2-2z" fill="#F2A33C"/>
  </g>
</svg>
