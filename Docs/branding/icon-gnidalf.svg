<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Горе-герои — Гнидальф Немытый</title>
  <defs>
    <clipPath id="frame"><rect width="512" height="512" rx="104"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="#141018"/>

    <!-- лучи -->
    <g fill="#F2A33C" opacity=".14">
      <g transform="translate(256 240)">
        <path d="M0 0 L 700 -84 L 700 84 Z"/>
        <path d="M0 0 L 700 -84 L 700 84 Z" transform="rotate(45)"/>
        <path d="M0 0 L 700 -84 L 700 84 Z" transform="rotate(90)"/>
        <path d="M0 0 L 700 -84 L 700 84 Z" transform="rotate(135)"/>
        <path d="M0 0 L 700 -84 L 700 84 Z" transform="rotate(180)"/>
        <path d="M0 0 L 700 -84 L 700 84 Z" transform="rotate(225)"/>
        <path d="M0 0 L 700 -84 L 700 84 Z" transform="rotate(270)"/>
        <path d="M0 0 L 700 -84 L 700 84 Z" transform="rotate(315)"/>
      </g>
    </g>

    <!-- борода клином: седая, немытая -->
    <path d="M170 380 C158 444 194 494 248 518 C302 494 338 444 326 380 Z" fill="#A99FB0"/>
    <path d="M204 424 q20 24 40 0" fill="none" stroke="#847A8F" stroke-width="8" stroke-linecap="round"/>
    <path d="M248 462 q20 24 40 0" fill="none" stroke="#847A8F" stroke-width="8" stroke-linecap="round"/>

    <!-- нос торчком -->
    <path d="M234 358 q14 -9 26 0 l-13 34 Z" fill="#A99FB0"/>

    <!-- глаза из тени под полями -->
    <circle cx="200" cy="350" r="16" fill="#F2A33C"/>
    <circle cx="294" cy="350" r="16" fill="#F2A33C"/>

    <!-- колпак -->
    <ellipse cx="248" cy="306" rx="178" ry="34" fill="#6D55A0"/>
    <path d="M120 312 C150 228 205 158 288 116 C318 100 352 96 366 112
             C348 140 322 196 330 250 C334 284 356 304 376 314 Z" fill="#8A6FC0"/>
    <circle cx="370" cy="104" r="17" fill="#F2A33C"/>

    <!-- заплатка -->
    <g transform="rotate(-8 232 220)">
      <path d="M196 192 H272 V248 H196 Z" fill="#6FA65A"/>
      <path d="M196 192 H272 M196 248 H272" stroke="#141018" stroke-width="6"
            stroke-dasharray="12 10" stroke-linecap="round"/>
    </g>

    <!-- муха -->
    <g transform="rotate(18 112 152)">
      <ellipse cx="112" cy="152" rx="14" ry="10" fill="#EDE6DA"/>
      <ellipse cx="104" cy="140" rx="11" ry="6" fill="#EDE6DA" opacity=".55"/>
      <ellipse cx="122" cy="140" rx="11" ry="6" fill="#EDE6DA" opacity=".55"/>
    </g>
    <path d="M60 214 q44 -52 96 -60" fill="none" stroke="#EDE6DA" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="4 16" opacity=".5"/>
  </g>
</svg>
